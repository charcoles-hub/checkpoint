name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping mycheckpoint.games
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://mycheckpoint.games/api/games/search?q=a")
          echo "Status: $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]
